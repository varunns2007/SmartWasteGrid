<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartWasteAI - AI-Powered Waste Logistics & Sorting Platform</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <!-- Leaflet Map CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- React & Babel CDNs -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkBg: '#090b0e',
                        cardBg: '#12161c',
                        glassBorder: 'rgba(157, 190, 183, 0.18)',
                        paletteCream: '#efe6d5',
                        paletteTeal: '#9dbeb7',
                        paletteRed: '#e73213',
                        accentPurple: '#a855f7',
                        accentBlue: '#38bdf8',
                        accentGreen: '#10b981',
                        accentAmber: '#f59e0b',
                        accentRose: '#e73213'
                    },
                    fontFamily: {
                        sans: ['Outfit', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace']
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #090b0e;
            color: #efe6d5;
            font-family: 'Outfit', sans-serif;
        }
        .info-panel {
            background: rgba(18, 22, 28, 0.88);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(157, 190, 183, 0.18);
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #090b0e;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #9dbeb7;
            border-radius: 4px;
        }
        .leaflet-popup-content-wrapper {
            background: #0d0f12 !important;
            color: #efe6d5 !important;
            border: 1px solid rgba(157, 190, 183, 0.3) !important;
            border-radius: 14px !important;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.8) !important;
            padding: 0 !important;
        }
        .leaflet-popup-content {
            margin: 0 !important;
            line-height: 1.4 !important;
        }
        .leaflet-popup-tip {
            background: #0d0f12 !important;
            border: 1px solid rgba(157, 190, 183, 0.3) !important;
        }
        .leaflet-container {
            background: #e5e7eb !important;
            font-family: 'Outfit', sans-serif !important;
        }
        .marker-pulse {
            position: relative;
        }
        .marker-pulse::after {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            border-radius: 50%;
            animation: mapPulse 2s infinite;
        }
        @keyframes mapPulse {
            0% { transform: scale(1); opacity: 0.8; box-shadow: 0 0 0 0 rgba(231, 50, 19, 0.7); }
            70% { transform: scale(1.6); opacity: 0; box-shadow: 0 0 0 10px rgba(231, 50, 19, 0); }
            100% { transform: scale(1); opacity: 0; }
        }
        .route-flow-line {
            stroke-dasharray: 8, 8;
            animation: routeDash 30s linear infinite;
        }
        @keyframes routeDash {
            to { stroke-dashoffset: -1000; }
        }
        /* Custom Truck Marker Pin */
        .truck-leaflet-pin {
            background: #e73213;
            color: #ffffff;
            border: 2px solid #ffffff;
            border-radius: 50%;
            box-shadow: 0 4px 14px rgba(231, 50, 19, 0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .truck-leaflet-pin:hover {
            transform: scale(1.2);
        }
    </style>
</head>
<body class="bg-darkBg text-zinc-100 min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        {% raw %}
        const { useState, useEffect, useRef } = React;

        const Icon = ({ name, className = "w-5 h-5", color = "currentColor" }) => {
            const svgProps = {
                className,
                stroke: color,
                strokeWidth: 2,
                strokeLinecap: "round",
                strokeLinejoin: "round",
                fill: "none",
                viewBox: "0 0 24 24",
                width: "24",
                height: "24"
            };

            switch (name) {
                case "zap": return (<svg {...svgProps}><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2" /></svg>);
                case "play": return (<svg {...svgProps}><polygon points="5 3 19 12 5 21 5 3" /></svg>);
                case "truck": return (<svg {...svgProps}><rect x="1" y="3" width="15" height="13" rx="2" /><polygon points="16 8 20 8 23 11 23 16 16 16 16 8" /><circle cx="5.5" cy="18.5" r="2.5" /><circle cx="18.5" cy="18.5" r="2.5" /></svg>);
                case "scale": return (<svg {...svgProps}><polygon points="12 3 20 8 12 13 4 8 12 3" /><path d="M12 13v8M4 8v6c0 4.4 3.6 8 8 8s8-3.6 8-8V8" /></svg>);
                case "activity": return (<svg {...svgProps}><polyline points="22 12 18 12 15 21 9 3 6 12 2 12" /></svg>);
                case "bar-chart": return (<svg {...svgProps}><path d="M3 3v18h18" /><path d="M18.7 8l-5.1 5.2-2.8-2.7L7 14.3" /></svg>);
                case "cpu": return (<svg {...svgProps}><rect x="4" y="4" width="16" height="16" rx="2" /><rect x="9" y="9" width="6" height="6" /><path d="M9 1v3M15 1v3M9 20v3M15 20v3M20 9h3M20 15h3M1 9h3M1 15h3" /></svg>);
                case "map-pin": return (<svg {...svgProps}><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z" /><circle cx="12" cy="10" r="3" /></svg>);
                case "camera": return (<svg {...svgProps}><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></svg>);
                case "search": return (<svg {...svgProps}><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>);
                case "refresh": return (<svg {...svgProps}><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>);
                default: return null;
            }
        };

        const MAP_TILE_PRESETS = {
            osmRoad: {
                name: "Full Road & Street View",
                url: "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
                attrib: "&copy; OpenStreetMap contributors (Full Detailed Road View)"
            },
            esriRoad: {
                name: "Esri Highway & Streets",
                url: "https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}",
                attrib: "Tiles &copy; Esri World Street Map"
            },
            esriSatellite: {
                name: "Satellite Imagery",
                url: "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
                attrib: "Tiles &copy; Esri World Imagery"
            },
            cartoVoyager: {
                name: "City Voyager Map",
                url: "https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png",
                attrib: "&copy; OpenStreetMap &copy; CARTO"
            }
        };

        const App = () => {
            const [summary, setSummary] = useState(null);
            const [unallocated, setUnallocated] = useState([]);
            const [forecasts, setForecasts] = useState(null);
            const [loading, setLoading] = useState(true);
            const [simulating, setSimulating] = useState(false);
            const [numBatchesToSimulate, setNumBatchesToSimulate] = useState(3);
            const [solverMode, setSolverMode] = useState('cnn_milp');
            const [lastRunDetails, setLastRunDetails] = useState(null);
            const [activeTab, setActiveTab] = useState('batches');

            const [activeTransitStation, setActiveTransitStation] = useState("Mylapore Transfer Station");
            const [transitTelemetry, setTransitTelemetry] = useState(null);
            const [transitConveyorLogs, setTransitConveyorLogs] = useState([]);
            const [transitLiveMode, setTransitLiveMode] = useState(true);
            const [feedTimestamp, setFeedTimestamp] = useState(Date.now());

            // Camera Hardware State
            const [cameraMode, setCameraMode] = useState('hardware');
            const [cameraIdx, setCameraIdx] = useState(0);
            const [availableWebcams, setAvailableWebcams] = useState([]);
            const [isHardwareActive, setIsHardwareActive] = useState(false);

            // Extension States
            const [dbSubTab, setDbSubTab] = useState('detections');
            const [dbDetections, setDbDetections] = useState(null);
            const [dbBatches, setDbBatches] = useState(null);
            const [dbFacilities, setDbFacilities] = useState(null);
            const [dbRoutingLogs, setDbRoutingLogs] = useState(null);
            const [dbCategoryFilter, setDbCategoryFilter] = useState('all');
            const [dbStationFilter, setDbStationFilter] = useState('');
            const [dbPage, setDbPage] = useState(1);

            const [matchingData, setMatchingData] = useState(null);
            const [diversionData, setDiversionData] = useState(null);
            const [mrvData, setMrvData] = useState(null);

            // Map States
            const [mapStyleKey, setMapStyleKey] = useState('osmRoad');
            const [mapFilter, setMapFilter] = useState('all');
            const [truckSearchQuery, setTruckSearchQuery] = useState('');
            const [selectedTruck, setSelectedTruck] = useState(null);

            const mapContainerRef = useRef(null);
            const mapInstance = useRef(null);
            const mapMarkersGroup = useRef(null);
            const mapRoutesGroup = useRef(null);
            const mapTileLayerRef = useRef(null);

            const fetchWebcams = async () => {
                try {
                    const res = await fetch('/api/webcams').then(r => r.json());
                    if (res.webcams) setAvailableWebcams(res.webcams);
                    if (res.current_index !== undefined) setCameraIdx(res.current_index);
                    if (res.mode) setCameraMode(res.mode);
                    setIsHardwareActive(!!res.is_hardware_active);
                } catch (err) {
                    console.error("Webcams fetch error:", err);
                }
            };

            const fetchData = async () => {
                try {
                    const [sumRes, unRes, foreRes] = await Promise.all([
                        fetch('/api/dashboard/summary').then(r => r.json()),
                        fetch('/api/batches/unallocated').then(r => r.json()),
                        fetch('/api/forecasting').then(r => r.json())
                    ]);
                    setSummary(sumRes);
                    setUnallocated(unRes);
                    setForecasts(foreRes);
                } catch (err) {
                    console.error("Error fetching dashboard data:", err);
                } finally {
                    setLoading(false);
                }
            };

            const fetchExtensionData = async () => {
                try {
                    if (activeTab === 'db_viewer') {
                        if (dbSubTab === 'detections') {
                            const res = await fetch(`/api/database/detections?page=${dbPage}&category=${dbCategoryFilter}&station=${dbStationFilter}`).then(r => r.json());
                            setDbDetections(res);
                        } else if (dbSubTab === 'batches') {
                            const res = await fetch(`/api/database/batches?page=${dbPage}`).then(r => r.json());
                            setDbBatches(res);
                        } else if (dbSubTab === 'facilities') {
                            const res = await fetch('/api/database/facilities').then(r => r.json());
                            setDbFacilities(res);
                        } else if (dbSubTab === 'routing') {
                            const res = await fetch('/api/database/routing-logs').then(r => r.json());
                            setDbRoutingLogs(res);
                        }
                    } else if (activeTab === 'matching') {
                        const res = await fetch('/api/matching/status').then(r => r.json());
                        setMatchingData(res);
                    } else if (activeTab === 'diversion') {
                        const res = await fetch('/api/metrics/diversion').then(r => r.json());
                        setDiversionData(res);
                    } else if (activeTab === 'mrv') {
                        const res = await fetch('/api/mrv/summary').then(r => r.json());
                        setMrvData(res);
                    }
                } catch (err) {
                    console.error("Error fetching extension data:", err);
                }
            };

            const clearDetections = async () => {
                if (!confirm("Are you sure you want to purge all detection records from the database?")) return;
                try {
                    const res = await fetch('/api/database/detections/clear', { method: 'POST' });
                    const data = await res.json();
                    if (data.status === 'SUCCESS' || data.status === 'success') {
                        fetchExtensionData();
                    }
                } catch (err) {
                    console.error("Error clearing detections:", err);
                }
            };

            useEffect(() => {
                fetchWebcams();
                fetchData();
            }, []);

            useEffect(() => {
                fetchExtensionData();
                const intervalId = setInterval(() => {
                    if (activeTab === 'db_viewer' || activeTab === 'matching' || activeTab === 'diversion') {
                        fetchExtensionData();
                    }
                }, 3500);
                return () => clearInterval(intervalId);
            }, [activeTab, dbSubTab, dbPage, dbCategoryFilter, dbStationFilter]);

            useEffect(() => {
                let intervalId = null;
                if (transitLiveMode && activeTab === 'transit') {
                    const fetchTick = async () => {
                        try {
                            const res = await fetch(`/api/transit-centers/telemetry?station_name=${encodeURIComponent(activeTransitStation)}`).then(r => r.json());
                            setTransitTelemetry(res);
                            setTransitConveyorLogs(prev => [res, ...prev.slice(0, 19)]);
                        } catch (err) {
                            console.error("Error fetching live conveyor tick:", err);
                        }
                    };
                    fetchTick();
                    intervalId = setInterval(fetchTick, 1000);
                }
                return () => {
                    if (intervalId) clearInterval(intervalId);
                };
            }, [transitLiveMode, activeTab, activeTransitStation]);

            // Camera toggle
            const toggleCameraMode = async (newMode, targetIdx) => {
                const modeToSet = newMode || (cameraMode === 'simulation' ? 'hardware' : 'simulation');
                const indexToSet = targetIdx !== undefined ? targetIdx : cameraIdx;
                try {
                    const res = await fetch('/api/camera/mode', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ mode: modeToSet, camera_index: indexToSet })
                    }).then(r => r.json());
                    setCameraMode(res.mode);
                    if (res.camera_index !== undefined) setCameraIdx(res.camera_index);
                    setIsHardwareActive(!!res.is_hardware_active);
                    setFeedTimestamp(Date.now());
                    fetchWebcams();
                } catch (err) {
                    console.error("Error setting camera mode:", err);
                }
            };

            // Switch Tile Layer
            const switchMapStyle = (styleKey) => {
                setMapStyleKey(styleKey);
                if (!mapInstance.current || !window.L) return;
                const preset = MAP_TILE_PRESETS[styleKey] || MAP_TILE_PRESETS.osmRoad;

                if (mapTileLayerRef.current) {
                    mapInstance.current.removeLayer(mapTileLayerRef.current);
                }

                mapTileLayerRef.current = L.tileLayer(preset.url, {
                    attribution: preset.attrib,
                    maxZoom: 19,
                    subdomains: 'abc'
                }).addTo(mapInstance.current);
            };

            // Initialize Map
            useEffect(() => {
                if (!mapContainerRef.current || loading || !summary || !window.L) return;

                if (!mapInstance.current) {
                    mapInstance.current = L.map(mapContainerRef.current, {
                        center: [13.045, 80.225],
                        zoom: 12,
                        zoomControl: true
                    });

                    const preset = MAP_TILE_PRESETS.osmRoad;
                    mapTileLayerRef.current = L.tileLayer(preset.url, {
                        attribution: preset.attrib,
                        maxZoom: 19,
                        subdomains: 'abc'
                    }).addTo(mapInstance.current);

                    mapRoutesGroup.current = L.layerGroup().addTo(mapInstance.current);
                    mapMarkersGroup.current = L.layerGroup().addTo(mapInstance.current);
                }

                renderMapEntities();
            }, [loading, summary]);

            // Re-render markers when filter or truck search changes
            useEffect(() => {
                renderMapEntities();
            }, [mapFilter, truckSearchQuery, summary]);

            const renderMapEntities = () => {
                if (!mapInstance.current || !mapMarkersGroup.current || !summary || !window.L) return;

                mapInstance.current.invalidateSize();
                mapMarkersGroup.current.clearLayers();
                if (mapRoutesGroup.current) mapRoutesGroup.current.clearLayers();

                const transferStations = [
                    { name: "Mylapore Transfer Station", lat: 13.0368, lng: 80.2676, weight: "12.4 Tons", org: "58%", rec: "28%" },
                    { name: "T. Nagar Collection Hub", lat: 13.0418, lng: 80.2341, weight: "9.8 Tons", org: "62%", rec: "22%" },
                    { name: "Adyar Transfer Hub", lat: 12.9985, lng: 80.2565, weight: "14.2 Tons", org: "48%", rec: "36%" },
                    { name: "Anna Nagar West Station", lat: 13.0878, lng: 80.1994, weight: "11.5 Tons", org: "52%", rec: "31%" },
                    { name: "Velachery Station Queue", lat: 12.9750, lng: 80.2210, weight: "8.6 Tons", org: "60%", rec: "24%" },
                    { name: "Tambaram Central Queue", lat: 12.9249, lng: 80.1000, weight: "15.0 Tons", org: "44%", rec: "40%" }
                ];

                // 1. Render Treatment Plants
                if (mapFilter === 'all' || mapFilter === 'wte' || mapFilter === 'compost' || mapFilter === 'recycling') {
                    summary.plants.forEach(plant => {
                        const isWte = (plant.technology_type || '').includes('Energy') || (plant.technology_type || '').includes('Gasification') || (plant.technology_type || '').includes('RDF');
                        const isCompost = (plant.technology_type || '').includes('Compost') || (plant.technology_type || '').includes('Biomethanation');
                        const isRecycle = (plant.technology_type || '').includes('Recycl');

                        if (mapFilter === 'wte' && !isWte) return;
                        if (mapFilter === 'compost' && !isCompost) return;
                        if (mapFilter === 'recycling' && !isRecycle) return;

                        let colorBg = isCompost ? 'bg-emerald-600 shadow-emerald-600/60' : (isRecycle ? 'bg-sky-600 shadow-sky-600/60' : 'bg-amber-600 shadow-amber-600/60');
                        let iconLetter = isCompost ? '🌱' : (isRecycle ? '♻️' : '⚡');

                        const plantIcon = L.divIcon({
                            html: `<div class="marker-pulse w-9 h-9 rounded-full ${colorBg} border-2 border-white flex items-center justify-center shadow-xl cursor-pointer hover:scale-110 transition-transform"><span class="text-xs font-bold text-white">${iconLetter}</span></div>`,
                            className: 'custom-leaflet-icon',
                            iconSize: [36, 36],
                            iconAnchor: [18, 18]
                        });

                        const popupHtml = `
                            <div class="p-3.5 font-sans min-w-[250px] bg-zinc-950 text-white rounded-xl border border-zinc-800 shadow-2xl">
                                <div class="font-bold text-xs text-white uppercase border-b border-zinc-800 pb-2 mb-2">${plant.name}</div>
                                <div class="space-y-1 text-[11px] text-zinc-300">
                                    <div class="flex justify-between"><span>Type:</span> <strong class="text-emerald-400">${plant.technology_type}</strong></div>
                                    <div class="flex justify-between"><span>Capacity:</span> <strong class="text-white">${plant.capacity} Tons/day</strong></div>
                                    <div class="flex justify-between"><span>Current Utilization:</span> <strong class="text-amber-400">${plant.utilization} Tons (${plant.utilization_pct}%)</strong></div>
                                    <div class="flex justify-between"><span>Heat Recovery:</span> <strong class="text-purple-300">${plant.recovered_heat_mw} MW</strong></div>
                                    <div class="flex justify-between"><span>Trucks in Queue:</span> <strong class="text-sky-300">${plant.queue_length} Vehicles</strong></div>
                                </div>
                            </div>
                        `;
                        L.marker([plant.lat, plant.lng], { icon: plantIcon }).bindPopup(popupHtml).addTo(mapMarkersGroup.current);
                    });
                }

                // 2. Render Transfer Stations
                if (mapFilter === 'all' || mapFilter === 'transfer') {
                    transferStations.forEach(st => {
                        const stIcon = L.divIcon({
                            html: `<div class="w-8 h-8 rounded-xl bg-purple-600 border-2 border-white flex items-center justify-center shadow-lg shadow-purple-600/40 cursor-pointer hover:scale-110 transition-transform"><span class="text-xs font-bold text-white">📦</span></div>`,
                            className: 'custom-leaflet-icon',
                            iconSize: [32, 32],
                            iconAnchor: [16, 16]
                        });

                        const popupHtml = `
                            <div class="p-3 font-sans min-w-[230px] bg-zinc-950 text-white rounded-xl border border-zinc-800 shadow-2xl">
                                <div class="font-bold text-xs text-purple-300 uppercase border-b border-zinc-800 pb-2 mb-2">📦 ${st.name}</div>
                                <div class="space-y-1 text-[11px] text-zinc-300">
                                    <div class="flex justify-between"><span>Queued Payload:</span> <strong class="text-white">${st.weight}</strong></div>
                                    <div class="flex justify-between"><span>Organic Share:</span> <strong class="text-emerald-400">${st.org}</strong></div>
                                    <div class="flex justify-between"><span>Recyclable Share:</span> <strong class="text-sky-400">${st.rec}</strong></div>
                                </div>
                            </div>
                        `;
                        L.marker([st.lat, st.lng], { icon: stIcon }).bindPopup(popupHtml).addTo(mapMarkersGroup.current);
                    });
                }

                // 3. Render Real Waste Batch Trucks
                if ((mapFilter === 'all' || mapFilter === 'fleet') && summary.trucks) {
                    const filteredTrucks = summary.trucks.filter(t => {
                        if (!truckSearchQuery) return true;
                        const q = truckSearchQuery.toLowerCase();
                        const reg = (t.registration_number || '').toLowerCase();
                        const plant = (t.assigned_plant_name || '').toLowerCase();
                        const bId = String((t.batch && t.batch.batch_id) || '');
                        return reg.includes(q) || plant.includes(q) || bId.includes(q);
                    });

                    filteredTrucks.forEach((truck) => {
                        const truckIcon = L.divIcon({
                            html: `<div class="truck-leaflet-pin w-9 h-9"><span class="text-sm">🚛</span></div>`,
                            className: 'custom-leaflet-icon',
                            iconSize: [36, 36],
                            iconAnchor: [18, 18]
                        });

                        const popupHtml = `
                            <div class="p-3.5 font-sans min-w-[270px] bg-zinc-950 text-white rounded-xl border border-zinc-800 shadow-2xl">
                                <div class="flex items-center justify-between border-b border-zinc-800 pb-2 mb-2">
                                    <span class="font-mono font-bold text-xs text-[#e73213]">🚛 ${truck.registration_number}</span>
                                    <span class="text-[9px] font-bold px-2 py-0.5 rounded bg-emerald-500/20 text-emerald-300 border border-emerald-500/40">${truck.route_status}</span>
                                </div>
                                <div class="space-y-1.5 text-[11px] text-zinc-300">
                                    <div class="flex justify-between"><span>Driver:</span> <strong class="text-white">${truck.driver_name}</strong></div>
                                    <div class="flex justify-between"><span>Road Speed:</span> <strong class="text-sky-300">${truck.speed_kmh} km/h</strong></div>
                                    <div class="flex justify-between"><span>Destination Facility:</span> <strong class="text-emerald-300">${truck.assigned_plant_name}</strong></div>
                                    <div class="mt-2 p-2.5 rounded-lg bg-zinc-900 border border-zinc-800">

                                                    <div className="flex justify-between text-[#9dbeb7]">
                                                        <span>Transit Distance:</span>
                                                        <strong className="text-sky-300">{item.distance_or_cost_factor} km</strong>
                                                    </div>
                                                    <div className="text-[11px] text-[#efe6d5]/70 italic mt-1 bg-[#14181d] p-2 rounded-lg border border-glassBorder">
                                                        {item.reason}
                                                    </div>
                                                </div>
                                            </div>
                                        ))
                                    )}
                                </div>
                            </div>
                        )}

                        {/* TAB 5: Diversion Metrics */}
                        {activeTab === 'diversion' && (
                            <div className="space-y-6">
                                <div className="flex justify-between items-center border-b border-glassBorder/40 pb-3">
                                    <h3 className="text-xs font-bold text-white uppercase flex items-center gap-2">
                                        <Icon name="bar-chart" className="w-4 h-4 text-emerald-400" />
                                        Statewide & District Diversion Metrics Dashboard
                                    </h3>
                                    <span className="text-[10px] font-mono text-emerald-400 bg-emerald-950/60 px-3 py-1 rounded-lg border border-emerald-500/30">SUSTAINABILITY METRICS</span>
                                </div>

                                <div className="grid grid-cols-1 md:grid-cols-4 gap-4">
                                    <div className="bg-emerald-950/40 p-4 rounded-xl border border-emerald-500/30">
                                        <div className="text-[10px] font-semibold text-emerald-400 uppercase">Statewide Diversion Rate</div>
                                        <div className="text-3xl font-bold text-white mt-1">{(diversionData && diversionData.statewide_diversion_pct) || 78.4}%</div>
                                    </div>
                                    <div className="bg-zinc-950 p-4 rounded-xl border border-glassBorder">
                                        <div className="text-[10px] font-semibold text-gray-400 uppercase">Pre-System Baseline</div>
                                        <div className="text-3xl font-bold text-gray-300 mt-1">32.5%</div>
                                    </div>
                                    <div className="bg-zinc-950 p-4 rounded-xl border border-glassBorder">
                                        <div className="text-[10px] font-semibold text-sky-400 uppercase">Total Managed Waste</div>
                                        <div className="text-2xl font-bold text-white mt-1">{(diversionData && diversionData.total_waste_managed_tons) || 7170} Tons</div>
                                    </div>
                                    <div className="bg-zinc-950 p-4 rounded-xl border border-glassBorder">
                                        <div className="text-[10px] font-semibold text-purple-400 uppercase">Recovered Material</div>
                                        <div className="text-2xl font-bold text-purple-200 mt-1">{(diversionData && diversionData.total_waste_recovered_tons) || 5530} Tons</div>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* TAB 6: Carbon Impact & MRV */}
                        {activeTab === 'mrv' && (
                            <div className="space-y-6">
                                <div className="flex flex-col sm:flex-row sm:items-center justify-between border-b border-glassBorder/40 pb-3 gap-3">
                                    <div>
                                        <h3 className="text-xs font-bold text-[#efe6d5] uppercase flex items-center gap-2">
                                            <Icon name="scale" className="w-4 h-4 text-[#e73213]" />
                                            Carbon Impact & Cryptographic MRV Intake Ledger
                                        </h3>
                                        <p className="text-[11px] text-[#9dbeb7] mt-0.5">Tamper-Evident SHA-256 Hash Chain Linking Intake Detections to Carbon Avoidance Claims</p>
                                    </div>
                                    <a href="/api/mrv/export" target="_blank" className="bg-[#e73213] hover:bg-[#c8290e] text-white text-xs font-bold px-4 py-2 rounded-xl border border-[#e73213] shadow-lg shadow-[#e73213]/30 transition inline-flex items-center gap-2">
                                        <Icon name="zap" className="w-3.5 h-3.5" />
                                        Export MRV Report (CSV)
                                    </a>
                                </div>

                                <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                                    <div className="bg-[#0d0f12] p-4 rounded-xl border border-[#e73213]/40 shadow-lg">
                                        <div className="text-[10px] font-semibold text-[#9dbeb7] uppercase tracking-wider">Estimated Avoided Emissions</div>
                                        <div className="text-3xl font-bold text-[#e73213] mt-1">{(mrvData && mrvData.total_co2e_avoided_tons) || 18.4} Tons CO2e</div>
                                        <div className="text-[9px] text-[#efe6d5]/70 mt-1 italic">Basis: IPCC 2019 Methane Avoidance Baseline Factor</div>
                                    </div>
                                    <div className="bg-[#0d0f12] p-4 rounded-xl border border-glassBorder shadow-lg">
                                        <div className="text-[10px] font-semibold text-[#9dbeb7] uppercase tracking-wider">Verified MRV Records</div>
                                        <div className="text-3xl font-bold text-[#efe6d5] mt-1">{(mrvData && mrvData.mrv_records_count) || 12} Chained Entries</div>
                                        <div className="text-[9px] text-[#9dbeb7] mt-1">Cryptographically Linked to Intake Batches</div>
                                    </div>
                                    <div className="bg-[#0d0f12] p-4 rounded-xl border border-glassBorder shadow-lg">
                                        <div className="text-[10px] font-semibold text-[#9dbeb7] uppercase tracking-wider">Ledger Integrity</div>
                                        <div className="text-2xl font-bold text-emerald-400 mt-1">100% UNTAMPERED</div>
                                        <div className="text-[9px] text-emerald-300 mt-1">SHA-256 Hash Chain Verified</div>
                                    </div>
                                </div>
                            </div>
                        )}
                    </div>

                    {/* FULL ROAD VIEW & FLEET TRACKING SECTION */}
                    <div className="info-panel p-5 rounded-2xl bg-[#14181d] border border-glassBorder space-y-4">
                        <div className="flex flex-col lg:flex-row lg:items-center justify-between gap-3 border-b border-glassBorder pb-3">
                            <div>
                                <h2 className="text-xs font-bold uppercase tracking-wider text-[#efe6d5] flex items-center gap-2">
                                    <Icon name="map-pin" className="w-4 h-4 text-[#e73213]" />
                                    Full Road-Level Waste Logistics & Fleet Tracking Map
                                </h2>
                                <p className="text-[11px] text-[#9dbeb7] mt-0.5">
                                    Detailed Street & Highway Network &bull; Real-Time Waste Batch Truck Telemetry & Route Vectors
                                </p>
                            </div>
                            
                            <div className="flex items-center gap-2 flex-wrap">
                                {/* Map Style Switcher */}
                                <div className="flex bg-[#0d0f12] p-1 rounded-xl border border-glassBorder text-[11px]">
                                    <button onClick={() => switchMapStyle('osmRoad')} className={`px-2.5 py-1 rounded-lg font-bold transition ${mapStyleKey === 'osmRoad' ? 'bg-[#e73213] text-white shadow' : 'text-[#9dbeb7] hover:text-[#efe6d5]'}`}>
                                        🗺️ Full Road View
                                    </button>
                                    <button onClick={() => switchMapStyle('esriRoad')} className={`px-2.5 py-1 rounded-lg font-bold transition ${mapStyleKey === 'esriRoad' ? 'bg-[#e73213] text-white shadow' : 'text-[#9dbeb7] hover:text-[#efe6d5]'}`}>
                                        🛣️ Highway GIS
                                    </button>
                                    <button onClick={() => switchMapStyle('esriSatellite')} className={`px-2.5 py-1 rounded-lg font-bold transition ${mapStyleKey === 'esriSatellite' ? 'bg-[#9dbeb7] text-[#090b0e] shadow' : 'text-[#9dbeb7] hover:text-[#efe6d5]'}`}>
                                        🛰️ Satellite
                                    </button>
                                    <button onClick={() => switchMapStyle('cartoVoyager')} className={`px-2.5 py-1 rounded-lg font-bold transition ${mapStyleKey === 'cartoVoyager' ? 'bg-[#efe6d5] text-[#090b0e] shadow' : 'text-[#9dbeb7] hover:text-[#efe6d5]'}`}>
                                        🧭 City View
                                    </button>
                                </div>

                                <button onClick={fitMapBounds} className="bg-[#0d0f12] hover:bg-zinc-800 text-[#efe6d5] text-[11px] font-bold px-3 py-1.5 rounded-xl border border-glassBorder transition">
                                    Fit All Markers
                                </button>
                            </div>
                        </div>

                        {/* Search & Find Real Waste Batch Trucks Bar */}
                        <div className="flex flex-col sm:flex-row items-center gap-3 bg-[#0d0f12] p-3 rounded-xl border border-glassBorder">
                            <div className="relative flex-1 w-full">
                                <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                    <Icon name="search" className="w-4 h-4 text-[#9dbeb7]" />
                                </div>
                                <input 
                                    type="text" 
                                    value={truckSearchQuery} 
                                    onChange={(e) => setTruckSearchQuery(e.target.value)}
                                    placeholder="🔍 Search Waste Batch Truck by Plate (e.g. TN-01), Batch ID, or Destination..." 
                                    className="w-full pl-9 pr-4 py-2 bg-[#14181d] border border-glassBorder rounded-xl text-xs text-[#efe6d5] focus:outline-none focus:border-[#e73213]"
                                />
                            </div>

                            {/* Quick Truck Select Pills */}
                            <div className="flex items-center gap-1.5 overflow-x-auto custom-scrollbar w-full sm:w-auto">
                                {summary && summary.trucks && summary.trucks.slice(0, 5).map(t => (
                                    <button 
                                        key={t.id} 
                                        onClick={() => focusTruck(t)}
                                        className={`px-2.5 py-1.5 rounded-lg font-mono text-[10px] font-bold whitespace-nowrap transition border ${selectedTruck && selectedTruck.id === t.id ? 'bg-[#e73213] text-white border-[#e73213]' : 'bg-[#14181d] text-[#9dbeb7] border-glassBorder hover:text-[#efe6d5]'}`}
                                    >
                                        🚛 {t.registration_number}
                                    </button>
                                ))}
                            </div>
                        </div>

                        {/* Filter Bar */}
                        <div className="flex items-center gap-2 overflow-x-auto pb-1 text-[11px] font-bold">
                            <button onClick={() => setMapFilter('all')} className={`px-3 py-1.5 rounded-xl border transition ${mapFilter === 'all' ? 'bg-[#efe6d5] text-[#090b0e] border-[#efe6d5] shadow' : 'bg-[#0d0f12]/80 text-[#9dbeb7] border-glassBorder hover:text-[#efe6d5]'}`}>
                                All Locations
                            </button>
                            <button onClick={() => setMapFilter('fleet')} className={`px-3 py-1.5 rounded-xl border transition ${mapFilter === 'fleet' ? 'bg-[#e73213] text-white border-[#e73213] shadow' : 'bg-[#0d0f12]/80 text-[#9dbeb7] border-glassBorder hover:text-[#efe6d5]'}`}>
                                🚛 Active Fleet Trucks
                            </button>
                            <button onClick={() => setMapFilter('wte')} className={`px-3 py-1.5 rounded-xl border transition ${mapFilter === 'wte' ? 'bg-[#f59e0b] text-[#090b0e] border-[#f59e0b] shadow' : 'bg-[#0d0f12]/80 text-[#9dbeb7] border-glassBorder hover:text-[#efe6d5]'}`}>
                                ⚡ WtE & Gasification
                            </button>
                            <button onClick={() => setMapFilter('compost')} className={`px-3 py-1.5 rounded-xl border transition ${mapFilter === 'compost' ? 'bg-[#10b981] text-[#090b0e] border-[#10b981] shadow' : 'bg-[#0d0f12]/80 text-[#9dbeb7] border-glassBorder hover:text-[#efe6d5]'}`}>
                                🌱 Composting & Bio-CNG
                            </button>
                            <button onClick={() => setMapFilter('recycling')} className={`px-3 py-1.5 rounded-xl border transition ${mapFilter === 'recycling' ? 'bg-[#38bdf8] text-[#090b0e] border-[#38bdf8] shadow' : 'bg-[#0d0f12]/80 text-[#9dbeb7] border-glassBorder hover:text-[#efe6d5]'}`}>
                                ♻️ Recycling Plants
                            </button>
                            <button onClick={() => setMapFilter('transfer')} className={`px-3 py-1.5 rounded-xl border transition ${mapFilter === 'transfer' ? 'bg-[#a855f7] text-white border-[#a855f7] shadow' : 'bg-[#0d0f12]/80 text-[#9dbeb7] border-glassBorder hover:text-[#efe6d5]'}`}>
                                📦 Transfer Hubs
                            </button>
                        </div>

                        {/* Map Container */}
                        <div ref={mapContainerRef} className="flex-1 rounded-xl border border-glassBorder overflow-hidden shadow-2xl" style={{ height: '460px', width: '100%' }}></div>
                    </div>

                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
        {% endraw %}
    </script>
</body>
</html>
