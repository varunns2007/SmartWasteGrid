<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartWasteAI - AI-Powered Waste Logistics & Sorting Platform</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Leaflet Map CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- React & Babel CDNs -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkBg: '#0d0f12',
                        cardBg: '#14181d',
                        glassBorder: 'rgba(157, 190, 183, 0.18)',
                        paletteCream: '#efe6d5',
                        paletteTeal: '#9dbeb7',
                        paletteRed: '#e73213',
                        accentPurple: '#9dbeb7',
                        accentBlue: '#9dbeb7',
                        accentGreen: '#efe6d5',
                        accentAmber: '#e73213',
                        accentRose: '#e73213'
                    },
                    fontFamily: {
                        sans: ['Outfit', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #0d0f12;
            color: #efe6d5;
            font-family: 'Outfit', sans-serif;
        }
        .info-panel {
            background: rgba(20, 24, 29, 0.85);
            backdrop-filter: blur(14px);
            border: 1px solid rgba(157, 190, 183, 0.18);
        }
        .conveyor-belt-scroll {
            animation: conveyorMove 2s linear infinite;
        }
        @keyframes conveyorMove {
            0% { background-position: 0 0; }
            100% { background-position: 40px 0; }
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #0d0f12;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #9dbeb7;
            border-radius: 4px;
        }
        /* Custom Leaflet Dark Popups & Animated Map Markers with Curated Palette */
        .leaflet-popup-content-wrapper {
            background: #0d0f12 !important;
            color: #efe6d5 !important;
            border: 1px solid rgba(157, 190, 183, 0.3) !important;
            border-radius: 14px !important;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.8), 0 8px 10px -6px rgba(0, 0, 0, 0.8) !important;
            padding: 0 !important;
        }
        .leaflet-popup-content {
            margin: 0 !important;
            line-height: 1.4 !important;
        }
        .leaflet-popup-tip {
            background: #0d0f12 !important;
            border: 1px solid rgba(157, 190, 183, 0.3) !important;
        }
        .leaflet-container {
            background: #0d0f12 !important;
            font-family: 'Outfit', sans-serif !important;
        }
        .marker-pulse {
            position: relative;
        }
        .marker-pulse::after {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            border-radius: 50%;
            animation: mapPulse 2s infinite;
        }
        @keyframes mapPulse {
            0% { transform: scale(1); opacity: 0.8; box-shadow: 0 0 0 0 rgba(231, 50, 19, 0.7); }
            70% { transform: scale(1.6); opacity: 0; box-shadow: 0 0 0 10px rgba(231, 50, 19, 0); }
            100% { transform: scale(1); opacity: 0; }
        }
        .route-flow-line {
            stroke-dasharray: 8, 8;
            animation: routeDash 30s linear infinite;
        }
        @keyframes routeDash {
            to { stroke-dashoffset: -1000; }
        }
    </style>
</head>
<body class="bg-darkBg text-zinc-100 min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        {% raw %}
        const { useState, useEffect, useRef } = React;

        const Icon = ({ name, className = "w-5 h-5", color = "currentColor" }) => {
            const svgProps = {
                className,
                stroke: color,
                strokeWidth: 2,
                strokeLinecap: "round",
                strokeLinejoin: "round",
                fill: "none",
                viewBox: "0 0 24 24",
                width: "24",
                height: "24"
            };

            switch (name) {
                case "zap": return (<svg {...svgProps}><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2" /></svg>);
                case "play": return (<svg {...svgProps}><polygon points="5 3 19 12 5 21 5 3" /></svg>);
                case "truck": return (<svg {...svgProps}><rect x="1" y="3" width="15" height="13" rx="2" /><polygon points="16 8 20 8 23 11 23 16 16 16 16 8" /><circle cx="5.5" cy="18.5" r="2.5" /><circle cx="18.5" cy="18.5" r="2.5" /></svg>);
                case "scale": return (<svg {...svgProps}><polygon points="12 3 20 8 12 13 4 8 12 3" /><path d="M12 13v8M4 8v6c0 4.4 3.6 8 8 8s8-3.6 8-8V8" /></svg>);
                case "activity": return (<svg {...svgProps}><polyline points="22 12 18 12 15 21 9 3 6 12 2 12" /></svg>);
                case "bar-chart": return (<svg {...svgProps}><path d="M3 3v18h18" /><path d="M18.7 8l-5.1 5.2-2.8-2.7L7 14.3" /></svg>);
                case "cpu": return (<svg {...svgProps}><rect x="4" y="4" width="16" height="16" rx="2" /><rect x="9" y="9" width="6" height="6" /><path d="M9 1v3M15 1v3M9 20v3M15 20v3M20 9h3M20 15h3M1 9h3M1 15h3" /></svg>);
                case "map-pin": return (<svg {...svgProps}><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z" /><circle cx="12" cy="10" r="3" /></svg>);
                default: return null;
            }
        };

        const App = () => {
            const [summary, setSummary] = useState(null);
            const [unallocated, setUnallocated] = useState([]);
            const [forecasts, setForecasts] = useState(null);
            const [loading, setLoading] = useState(true);
            const [simulating, setSimulating] = useState(false);
            const [numBatchesToSimulate, setNumBatchesToSimulate] = useState(3);
            const [solverMode, setSolverMode] = useState('cnn_milp');
            const [lastRunDetails, setLastRunDetails] = useState(null);
            const [selectedBatchDetails, setSelectedBatchDetails] = useState(null);
            const [activeTab, setActiveTab] = useState('batches');
            const [activeForecastingZone, setActiveForecastingZone] = useState('Zone 9 (Teynampet)');

            const [activeTransitStation, setActiveTransitStation] = useState("Mylapore Transfer Station");
            const [transitTelemetry, setTransitTelemetry] = useState(null);
            const [transitConveyorLogs, setTransitConveyorLogs] = useState([]);
            const [transitLiveMode, setTransitLiveMode] = useState(true);

            // Extension States
            const [dbSubTab, setDbSubTab] = useState('detections');
            const [dbDetections, setDbDetections] = useState(null);
            const [dbBatches, setDbBatches] = useState(null);
            const [dbFacilities, setDbFacilities] = useState(null);
            const [dbRoutingLogs, setDbRoutingLogs] = useState(null);
            const [dbCategoryFilter, setDbCategoryFilter] = useState('all');
            const [dbStationFilter, setDbStationFilter] = useState('');
            const [dbPage, setDbPage] = useState(1);

            const [matchingData, setMatchingData] = useState(null);
            const [diversionData, setDiversionData] = useState(null);
            const [mrvData, setMrvData] = useState(null);

            const mapContainerRef = useRef(null);
            const mapInstance = useRef(null);
            const mapMarkersGroup = useRef(null);
            const animatedTrucksGroup = useRef(null);

            const fetchData = async () => {
                try {
                    const [sumRes, unRes, foreRes] = await Promise.all([
                        fetch('/api/dashboard/summary').then(r => r.json()),
                        fetch('/api/batches/unallocated').then(r => r.json()),
                        fetch('/api/forecasting').then(r => r.json())
                    ]);
                    setSummary(sumRes);
                    setUnallocated(unRes);
                    setForecasts(foreRes);
                } catch (err) {
                    console.error("Error fetching dashboard data:", err);
                } finally {
                    setLoading(false);
                }
            };

            const fetchExtensionData = async () => {
                try {
                    if (activeTab === 'db_viewer') {
                        if (dbSubTab === 'detections') {
                            const res = await fetch(`/api/database/detections?page=${dbPage}&category=${dbCategoryFilter}&station=${dbStationFilter}`).then(r => r.json());
                            setDbDetections(res);
                        } else if (dbSubTab === 'batches') {
                            const res = await fetch(`/api/database/batches?page=${dbPage}`).then(r => r.json());
                            setDbBatches(res);
                        } else if (dbSubTab === 'facilities') {
                            const res = await fetch('/api/database/facilities').then(r => r.json());
                            setDbFacilities(res);
                        } else if (dbSubTab === 'routing') {
                            const res = await fetch('/api/database/routing-logs').then(r => r.json());
                            setDbRoutingLogs(res);
                        }
                    } else if (activeTab === 'matching') {
                        const res = await fetch('/api/matching/status').then(r => r.json());
                        setMatchingData(res);
                    } else if (activeTab === 'diversion') {
                        const res = await fetch('/api/metrics/diversion').then(r => r.json());
                        setDiversionData(res);
                    } else if (activeTab === 'mrv') {
                        const res = await fetch('/api/mrv/summary').then(r => r.json());
                        setMrvData(res);
                    }
                } catch (err) {
                    console.error("Error fetching extension data:", err);
                }
            };

            useEffect(() => {
                fetchData();
                fetch('/api/camera/mode').then(r => r.json()).then(res => {
                    if (res && res.mode) setCameraMode(res.mode);
                }).catch(err => console.error(err));
            }, []);

            useEffect(() => {
                fetchExtensionData();
                const intervalId = setInterval(() => {
                    if (activeTab === 'db_viewer' || activeTab === 'matching' || activeTab === 'diversion') {
                        fetchExtensionData();
                    }
                }, 3500);
                return () => clearInterval(intervalId);
            }, [activeTab, dbSubTab, dbPage, dbCategoryFilter, dbStationFilter]);

            useEffect(() => {
                let intervalId = null;
                if (transitLiveMode && activeTab === 'transit') {
                    const fetchTick = async () => {
                        try {
                            const res = await fetch(`/api/transit-centers/telemetry?station_name=${encodeURIComponent(activeTransitStation)}`).then(r => r.json());
                            setTransitTelemetry(res);
                            setTransitConveyorLogs(prev => [res, ...prev.slice(0, 19)]);
                        } catch (err) {
                            console.error("Error fetching live conveyor tick:", err);
                        }
                    };
                    fetchTick();
                    intervalId = setInterval(fetchTick, 1000);
                }
                return () => {
                    if (intervalId) clearInterval(intervalId);
                };
            }, [transitLiveMode, activeTab, activeTransitStation]);

            const [mapStyle, setMapStyle] = useState('cartoDark');
            const [mapFilter, setMapFilter] = useState('all');
            const tileLayerRef = useRef(null);
            const routesLayerGroup = useRef(null);

            const switchMapStyle = (styleKey) => {
                setMapStyle(styleKey);
                if (!mapInstance.current) return;
                if (tileLayerRef.current) {
                    mapInstance.current.removeLayer(tileLayerRef.current);
                }
                
                let url = 'https://cartodb-basemaps-{s}.global.ssl.fastly.net/dark_all/{z}/{x}/{y}.png';
                let attrib = '&copy; OpenStreetMap &copy; CARTO (Free No-API-Key Dark Tiles)';
                
                if (styleKey === 'esriSatellite') {
                    url = 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}';
                    attrib = 'Tiles &copy; Esri (Free Open Satellite)';
                } else if (styleKey === 'osmStandard') {
                    url = 'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png';
                    attrib = '&copy; OpenStreetMap contributors (Free Standard Tiles)';
                }
                
                tileLayerRef.current = L.tileLayer(url, {
                    attribution: attrib,
                    maxZoom: 19,
                    subdomains: 'abcd'
                }).addTo(mapInstance.current);
            };

            useEffect(() => {
                if (mapContainerRef.current && !mapInstance.current && !loading) {
                    mapInstance.current = L.map(mapContainerRef.current, {
                        center: [13.04, 80.22],
                        zoom: 11,
                        zoomControl: true
                    });

                    tileLayerRef.current = L.tileLayer('https://cartodb-basemaps-{s}.global.ssl.fastly.net/dark_all/{z}/{x}/{y}.png', {
                        attribution: '&copy; OpenStreetMap &copy; CARTO',
                        subdomains: 'abcd',
                        maxZoom: 19
                    }).addTo(mapInstance.current);

                    routesLayerGroup.current = L.layerGroup().addTo(mapInstance.current);
                    mapMarkersGroup.current = L.layerGroup().addTo(mapInstance.current);
                    animatedTrucksGroup.current = L.layerGroup().addTo(mapInstance.current);
                }
            }, [loading]);

            const fitMapBounds = () => {
                if (!mapInstance.current || !summary) return;
                const bounds = L.latLngBounds([]);
                if (summary.plants) summary.plants.forEach(p => bounds.extend([p.lat, p.lng]));
                if (summary.trucks) summary.trucks.forEach(t => bounds.extend([t.lat, t.lng]));
                bounds.extend([13.0368, 80.2676]);
                bounds.extend([13.0418, 80.2341]);
                bounds.extend([12.9985, 80.2565]);
                bounds.extend([13.0878, 80.1994]);
                if (bounds.isValid()) {
                    mapInstance.current.fitBounds(bounds, { padding: [40, 40] });
                }
            };

            const focusLiveEdge = () => {
                if (mapInstance.current) {
                    mapInstance.current.flyTo([13.0368, 80.2676], 14, { duration: 1.5 });
                }
            };

            useEffect(() => {
                if (mapInstance.current && mapMarkersGroup.current && summary) {
                    mapInstance.current.invalidateSize();
                    mapMarkersGroup.current.clearLayers();
                    if (routesLayerGroup.current) routesLayerGroup.current.clearLayers();

                    const transferStations = [
                        { name: "Mylapore Transfer Station", lat: 13.0368, lng: 80.2676, weight: "12.4 Tons", org: "58%", rec: "28%" },
                        { name: "T. Nagar Collection Hub", lat: 13.0418, lng: 80.2341, weight: "9.8 Tons", org: "62%", rec: "22%" },
                        { name: "Adyar Transfer Hub", lat: 12.9985, lng: 80.2565, weight: "14.2 Tons", org: "48%", rec: "36%" },
                        { name: "Anna Nagar West Station", lat: 13.0878, lng: 80.1994, weight: "11.5 Tons", org: "52%", rec: "31%" },
                        { name: "Velachery Station Queue", lat: 12.9750, lng: 80.2210, weight: "8.6 Tons", org: "60%", rec: "24%" },
                        { name: "Tambaram Central Queue", lat: 12.9249, lng: 80.1000, weight: "15.0 Tons", org: "44%", rec: "40%" }
                    ];

                    // Render Plants
                    if (mapFilter === 'all' || mapFilter === 'wte' || mapFilter === 'compost' || mapFilter === 'recycling') {
                        summary.plants.forEach(plant => {
                            const isWte = plant.technology_type.includes('Energy') || plant.technology_type.includes('Gasification') || plant.technology_type.includes('RDF');
                            const isCompost = plant.technology_type.includes('Composting') || plant.technology_type.includes('Biomethanation');
                            const isRecycle = plant.technology_type.includes('Recycling');

                            if (mapFilter === 'wte' && !isWte) return;
                            if (mapFilter === 'compost' && !isCompost) return;
                            if (mapFilter === 'recycling' && !isRecycle) return;

                            let colorBg = 'bg-amber-500 shadow-amber-500/50';
                            let badgeColor = 'bg-amber-500/20 text-amber-300 border-amber-500/40';
                            let iconLetter = '⚡';

                            if (isCompost) {
                                colorBg = 'bg-emerald-500 shadow-emerald-500/50';
                                badgeColor = 'bg-emerald-500/20 text-emerald-300 border-emerald-500/40';
                                iconLetter = '🌱';
                            } else if (isRecycle) {
                                colorBg = 'bg-sky-500 shadow-sky-500/50';
                                badgeColor = 'bg-sky-500/20 text-sky-300 border-sky-500/40';
                                iconLetter = '♻️';
                            }

                            const plantIcon = L.divIcon({
                                html: `<div class="marker-pulse w-9 h-9 rounded-full ${colorBg} border-2 border-zinc-950 flex items-center justify-center shadow-xl cursor-pointer hover:scale-110 transition-transform">
                                         <span class="text-xs font-bold text-white">${iconLetter}</span>
                                       </div>`,
                                className: 'custom-leaflet-icon',
                                iconSize: [36, 36],
                                iconAnchor: [18, 18]
                            });

                            const popupHtml = `
                                <div class="p-3.5 font-sans min-w-[250px] bg-zinc-950 text-white rounded-xl border border-zinc-800 shadow-2xl">
                                    <div class="flex items-center justify-between border-b border-zinc-800 pb-2 mb-2">
                                        <span class="text-xs font-bold text-white uppercase">${plant.name}</span>
                                        <span class="text-[9px] font-bold px-2 py-0.5 rounded border ${badgeColor}">${plant.technology_type}</span>
                                    </div>
                                    <div class="space-y-1.5 text-[11px] text-zinc-300">
                                        <div class="flex justify-between"><span>Max Capacity:</span> <strong class="text-white">${plant.capacity} Tons/day</strong></div>
                                        <div class="flex justify-between"><span>Current Load:</span> <strong class="text-amber-400">${plant.utilization} Tons (${plant.utilization_pct}%)</strong></div>
                                        <div class="w-full bg-zinc-900 h-2 rounded-full overflow-hidden my-1 border border-zinc-800">
                                            <div class="bg-gradient-to-r from-emerald-500 to-amber-400 h-full" style="width: ${plant.utilization_pct}%"></div>
                                        </div>
                                        <div class="flex justify-between"><span>Heat Recovered:</span> <strong class="text-purple-300">${plant.recovered_heat_mw} MW</strong></div>
                                        <div class="flex justify-between"><span>Processing Cost:</span> <strong class="text-emerald-300">₹${plant.processing_cost_per_ton}/Ton</strong></div>
                                        <div class="flex justify-between"><span>Queue Length:</span> <strong class="text-sky-300">${plant.queue_length} Trucks Waiting</strong></div>
                                    </div>
                                </div>
                            `;

                            L.marker([plant.lat, plant.lng], { icon: plantIcon })
                                .bindPopup(popupHtml)
                                .addTo(mapMarkersGroup.current);
                        });
                    }

                    // Render Transfer Stations
                    if (mapFilter === 'all' || mapFilter === 'transfer') {
                        transferStations.forEach(st => {
                            const stIcon = L.divIcon({
                                html: `<div class="w-8 h-8 rounded-xl bg-purple-600 border-2 border-zinc-950 flex items-center justify-center shadow-lg shadow-purple-500/40 cursor-pointer hover:scale-110 transition-transform">
                                         <span class="text-xs font-bold text-white">📦</span>
                                       </div>`,
                                className: 'custom-leaflet-icon',
                                iconSize: [32, 32],
                                iconAnchor: [16, 16]
                            });

                            const popupHtml = `
                                <div class="p-3 font-sans min-w-[230px] bg-zinc-950 text-white rounded-xl border border-zinc-800 shadow-2xl">
                                    <div class="flex items-center justify-between border-b border-zinc-800 pb-2 mb-2">
                                        <span class="text-xs font-bold text-purple-300 uppercase">${st.name}</span>
                                        <span class="text-[9px] font-bold px-2 py-0.5 rounded border bg-purple-500/20 text-purple-300 border-purple-500/40">TRANSFER HUB</span>
                                    </div>
                                    <div class="space-y-1 text-[11px] text-zinc-300">
                                        <div class="flex justify-between"><span>Queued Payload:</span> <strong class="text-white">${st.weight}</strong></div>
                                        <div class="flex justify-between"><span>Organic Share:</span> <strong class="text-emerald-400">${st.org}</strong></div>
                                        <div class="flex justify-between"><span>Recyclable Share:</span> <strong class="text-sky-400">${st.rec}</strong></div>
                                    </div>
                                </div>
                            `;

                            L.marker([st.lat, st.lng], { icon: stIcon })
                                .bindPopup(popupHtml)
                                .addTo(mapMarkersGroup.current);
                        });
                    }

                    // Render Active Fleet Trucks
                    if ((mapFilter === 'all' || mapFilter === 'fleet') && summary.trucks) {
                        summary.trucks.forEach((truck, idx) => {
                            const truckIcon = L.divIcon({
                                html: `<div class="w-8 h-8 rounded-full bg-zinc-900 border-2 border-emerald-400 flex items-center justify-center shadow-lg shadow-emerald-500/30 cursor-pointer hover:scale-110 transition-transform">
                                         <span class="text-xs">🚛</span>
                                       </div>`,
                                className: 'custom-leaflet-icon',
                                iconSize: [32, 32],
                                iconAnchor: [16, 16]
                            });

                            const popupHtml = `
                                <div class="p-3 font-sans min-w-[230px] bg-zinc-950 text-white rounded-xl border border-zinc-800 shadow-2xl">
                                    <div class="flex items-center justify-between border-b border-zinc-800 pb-2 mb-2">
                                        <span class="text-xs font-mono font-bold text-emerald-400">${truck.registration_number}</span>
                                        <span class="text-[9px] font-bold px-2 py-0.5 rounded border bg-emerald-500/20 text-emerald-300 border-emerald-500/40">${truck.route_status}</span>
                                    </div>
                                    <div class="space-y-1 text-[11px] text-zinc-300">
                                        <div class="flex justify-between"><span>Capacity:</span> <strong class="text-white">${truck.capacity_tons} Tons</strong></div>
                                        <div class="flex justify-between"><span>Telemetry Lat/Lng:</span> <strong class="text-zinc-400">${truck.lat.toFixed(3)}, ${truck.lng.toFixed(3)}</strong></div>
                                    </div>
                                </div>
                            `;

                            L.marker([truck.lat, truck.lng], { icon: truckIcon })
                                .bindPopup(popupHtml)
                                .addTo(mapMarkersGroup.current);

                            // Connect Truck to nearest plant with glowing animated route polyline
                            if (summary.plants && summary.plants[idx % summary.plants.length]) {
                                const targetPlant = summary.plants[idx % summary.plants.length];
                                const polyline = L.polyline([[truck.lat, truck.lng], [targetPlant.lat, targetPlant.lng]], {
                                    color: '#10b981',
                                    weight: 2,
                                    opacity: 0.6,
                                    className: 'route-flow-line'
                                });
                                polyline.bindTooltip(`Route Vector: ${truck.registration_number} → ${targetPlant.name}`, { sticky: true });
                                polyline.addTo(routesLayerGroup.current);
                            }
                        });
                    }
                }
            }, [summary, mapFilter]);

            const [cameraMode, setCameraMode] = useState('hardware');
            const [cameraIdx, setCameraIdx] = useState(1);

            const toggleCameraMode = async (newMode, targetIdx) => {
                const modeToSet = newMode || (cameraMode === 'simulation' ? 'hardware' : 'simulation');
                const indexToSet = targetIdx !== undefined ? targetIdx : cameraIdx;
                try {
                    const res = await fetch('/api/camera/mode', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ mode: modeToSet, camera_index: indexToSet })
                    }).then(r => r.json());
                    setCameraMode(res.mode);
                    if (res.camera_index !== undefined) setCameraIdx(res.camera_index);
                } catch (err) {
                    console.error("Error setting camera mode:", err);
                }
            };

            const runSimulation = async () => {
                setSimulating(true);
                try {
                    await toggleCameraMode('simulation');
                    const [wfRes, convRes] = await Promise.all([
                        fetch('/api/workflow', {
                            method: 'POST',

                                        <div className="text-[10px] font-semibold text-purple-400 uppercase">Recovered Material</div>
                                        <div className="text-2xl font-bold text-purple-200 mt-1">{(diversionData && diversionData.total_waste_recovered_tons) || 5530} Tons</div>
                                    </div>
                                </div>
                            </div>
                        )}
                        
                        {activeTab === 'mrv' && (
                            <div className="space-y-6">
                                <div className="flex flex-col sm:flex-row sm:items-center justify-between border-b border-glassBorder/40 pb-3 gap-3">
                                    <div>
                                        <h3 className="text-xs font-bold text-[#efe6d5] uppercase flex items-center gap-2">
                                            <Icon name="scale" className="w-4 h-4 text-[#e73213]" />
                                            Carbon Impact & Cryptographic MRV Intake Ledger
                                        </h3>
                                        <p className="text-[11px] text-[#9dbeb7] mt-0.5">Tamper-Evident SHA-256 Hash Chain Linking Intake Detections to Carbon Avoidance Claims</p>
                                    </div>
                                    <a href="/api/mrv/export" target="_blank" className="bg-[#e73213] hover:bg-[#c8290e] text-white text-xs font-bold px-4 py-2 rounded-xl border border-[#e73213] shadow-lg shadow-[#e73213]/30 transition inline-flex items-center gap-2">
                                        <Icon name="zap" className="w-3.5 h-3.5" />
                                        Export Auditor-Ready MRV Report (CSV)
                                    </a>
                                </div>

                                <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                                    <div className="bg-[#0d0f12] p-4 rounded-xl border border-[#e73213]/40 shadow-lg">
                                        <div className="text-[10px] font-semibold text-[#9dbeb7] uppercase tracking-wider">Estimated Avoided Emissions</div>
                                        <div className="text-3xl font-bold text-[#e73213] mt-1">{(mrvData && mrvData.total_co2e_avoided_tons) || 18.4} Tons CO2e</div>
                                        <div className="text-[9px] text-[#efe6d5]/70 mt-1 italic">Basis: IPCC 2019 Methane Avoidance Baseline Factor</div>
                                    </div>
                                    <div className="bg-[#0d0f12] p-4 rounded-xl border border-glassBorder shadow-lg">
                                        <div className="text-[10px] font-semibold text-[#9dbeb7] uppercase tracking-wider">Verified MRV Records</div>
                                        <div className="text-3xl font-bold text-[#efe6d5] mt-1">{(mrvData && mrvData.mrv_records_count) || 12} Chained Entries</div>
                                        <div className="text-[9px] text-[#9dbeb7] mt-1">Cryptographically Linked to Intake Batches</div>
                                    </div>
                                    <div className="bg-[#0d0f12] p-4 rounded-xl border border-glassBorder shadow-lg">
                                        <div className="text-[10px] font-semibold text-[#9dbeb7] uppercase tracking-wider">Ledger Integrity</div>
                                        <div className="text-2xl font-bold text-emerald-400 mt-1">100% UNTAMPERED</div>
                                        <div className="text-[9px] text-emerald-300 mt-1">SHA-256 Hash Chain Verified</div>
                                    </div>
                                </div>

                                <div className="space-y-3">
                                    <h4 className="text-xs font-bold text-[#efe6d5] uppercase tracking-wider">Tamper-Evident Intake & MRV Audit Ledger</h4>
                                    <div className="overflow-x-auto rounded-xl border border-glassBorder bg-[#0d0f12]/80 max-h-72 custom-scrollbar">
                                        <table className="w-full text-left text-xs border-collapse">
                                            <thead>
                                                <tr className="border-b border-glassBorder text-[#9dbeb7] uppercase font-semibold text-[10px] bg-[#14181d]">
                                                    <th className="py-2.5 px-3">Entry ID</th>
                                                    <th className="py-2.5 px-3">Type</th>
                                                    <th className="py-2.5 px-3">Metadata Info</th>
                                                    <th className="py-2.5 px-3">Payload SHA-256</th>
                                                    <th className="py-2.5 px-3">Previous Ledger Hash</th>
                                                    <th className="py-2.5 px-3">Current Ledger Hash</th>
                                                    <th className="py-2.5 px-3">Timestamp</th>
                                                </tr>
                                            </thead>
                                            <tbody className="divide-y divide-zinc-800/60 text-[#efe6d5]">
                                                {(!mrvData || !mrvData.cryptographic_ledger || mrvData.cryptographic_ledger.length === 0) ? (
                                                    <tr><td colSpan="7" className="py-8 text-center text-gray-500 italic">No ledger entries recorded.</td></tr>
                                                ) : (
                                                    mrvData.cryptographic_ledger.map(entry => (
                                                        <tr key={entry.entry_id} className="hover:bg-white/[0.02] font-mono text-[11px]">
                                                            <td className="py-2.5 px-3 text-[#9dbeb7]">#{entry.entry_id}</td>
                                                            <td className="py-2.5 px-3">
                                                                <span className={`px-2 py-0.5 rounded text-[9px] font-bold border ${entry.entry_type === 'MRV_RECORD' ? 'bg-[#e73213]/20 text-[#e73213] border-[#e73213]/40' : (entry.entry_type === 'ROUTING' ? 'bg-[#9dbeb7]/20 text-[#9dbeb7] border-[#9dbeb7]/40' : 'bg-zinc-800 text-gray-300 border-zinc-700')}`}>
                                                                    {entry.entry_type}
                                                                </span>
                                                            </td>
                                                            <td className="py-2.5 px-3 text-white font-sans text-xs">{entry.metadata_info}</td>
                                                            <td className="py-2.5 px-3 text-zinc-400 font-mono text-[10px]">{entry.payload_hash ? entry.payload_hash.substring(0, 12) + "..." : "N/A"}</td>
                                                            <td className="py-2.5 px-3 text-zinc-500 font-mono text-[10px]">{entry.previous_hash ? entry.previous_hash.substring(0, 12) + "..." : "GENESIS"}</td>
                                                            <td className="py-2.5 px-3 text-emerald-400 font-mono text-[10px]">{entry.current_hash ? entry.current_hash.substring(0, 12) + "..." : "N/A"}</td>
                                                            <td className="py-2.5 px-3 text-zinc-500 text-[10px]">{entry.timestamp}</td>
                                                        </tr>
                                                    ))
                                                )}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            </div>
                        )}
                    </div>

                    <div className="info-panel p-5 rounded-2xl bg-[#14181d] border border-glassBorder space-y-4">
                        <div className="flex flex-col lg:flex-row lg:items-center justify-between gap-3 border-b border-glassBorder pb-3">
                            <div>
                                <h2 className="text-xs font-bold uppercase tracking-wider text-[#efe6d5] flex items-center gap-2">
                                    <Icon name="map-pin" className="w-4 h-4 text-[#e73213]" />
                                    Smart City GIS Digital Twin Map (Chennai ULB Case Study)
                                </h2>
                                <p className="text-[11px] text-[#9dbeb7] mt-0.5">100% Open Access Maps (Zero API Keys) &bull; Live Fleet & Treatment Facility Telemetry</p>
                            </div>
                            
                            
                            <div className="flex items-center gap-2 flex-wrap">
                                
                                <div className="flex bg-[#0d0f12] p-1 rounded-xl border border-glassBorder text-[11px]">
                                    <button onClick={() => switchMapStyle('cartoDark')} className={`px-2.5 py-1 rounded-lg font-bold transition ${mapStyle === 'cartoDark' ? 'bg-[#e73213] text-white shadow' : 'text-[#9dbeb7] hover:text-[#efe6d5]'}`}>
                                        🌙 Dark
                                    </button>
                                    <button onClick={() => switchMapStyle('esriSatellite')} className={`px-2.5 py-1 rounded-lg font-bold transition ${mapStyle === 'esriSatellite' ? 'bg-[#9dbeb7] text-[#0d0f12] shadow' : 'text-[#9dbeb7] hover:text-[#efe6d5]'}`}>
                                        🛰️ Satellite
                                    </button>
                                    <button onClick={() => switchMapStyle('osmStandard')} className={`px-2.5 py-1 rounded-lg font-bold transition ${mapStyle === 'osmStandard' ? 'bg-[#efe6d5] text-[#0d0f12] shadow' : 'text-[#9dbeb7] hover:text-[#efe6d5]'}`}>
                                        🗺️ Street
                                    </button>
                                </div>
                                
                                <button onClick={fitMapBounds} className="bg-[#0d0f12] hover:bg-zinc-800 text-[#efe6d5] text-[11px] font-bold px-3 py-1.5 rounded-xl border border-glassBorder transition">
                                    Fit All Markers
                                </button>
                                <button onClick={focusLiveEdge} className="bg-[#e73213]/20 hover:bg-[#e73213]/40 text-[#e73213] text-[11px] font-bold px-3 py-1.5 rounded-xl border border-[#e73213]/40 transition">
                                    Focus Live Edge
                                </button>
                            </div>
                        </div>

                        
                        <div className="flex items-center gap-2 overflow-x-auto pb-1 text-[11px] font-bold">
                            <button onClick={() => setMapFilter('all')} className={`px-3 py-1.5 rounded-xl border transition ${mapFilter === 'all' ? 'bg-[#efe6d5] text-[#0d0f12] border-[#efe6d5] shadow' : 'bg-[#0d0f12]/80 text-[#9dbeb7] border-glassBorder hover:text-[#efe6d5]'}`}>
                                All Locations
                            </button>
                            <button onClick={() => setMapFilter('wte')} className={`px-3 py-1.5 rounded-xl border transition ${mapFilter === 'wte' ? 'bg-[#e73213] text-white border-[#e73213] shadow' : 'bg-[#0d0f12]/80 text-[#9dbeb7] border-glassBorder hover:text-[#efe6d5]'}`}>
                                ⚡ WtE & Gasification
                            </button>
                            <button onClick={() => setMapFilter('compost')} className={`px-3 py-1.5 rounded-xl border transition ${mapFilter === 'compost' ? 'bg-[#9dbeb7] text-[#0d0f12] border-[#9dbeb7] shadow' : 'bg-[#0d0f12]/80 text-[#9dbeb7] border-glassBorder hover:text-[#efe6d5]'}`}>
                                🌱 Composting & Bio-CNG
                            </button>
                            <button onClick={() => setMapFilter('recycling')} className={`px-3 py-1.5 rounded-xl border transition ${mapFilter === 'recycling' ? 'bg-[#efe6d5] text-[#0d0f12] border-[#efe6d5] shadow' : 'bg-[#0d0f12]/80 text-[#9dbeb7] border-glassBorder hover:text-[#efe6d5]'}`}>
                                ♻️ Recycling Plants
                            </button>
                            <button onClick={() => setMapFilter('transfer')} className={`px-3 py-1.5 rounded-xl border transition ${mapFilter === 'transfer' ? 'bg-[#9dbeb7] text-[#0d0f12] border-[#9dbeb7] shadow' : 'bg-[#0d0f12]/80 text-[#9dbeb7] border-glassBorder hover:text-[#efe6d5]'}`}>
                                📦 Transfer Hubs
                            </button>
                            <button onClick={() => setMapFilter('fleet')} className={`px-3 py-1.5 rounded-xl border transition ${mapFilter === 'fleet' ? 'bg-[#e73213] text-white border-[#e73213] shadow' : 'bg-[#0d0f12]/80 text-[#9dbeb7] border-glassBorder hover:text-[#efe6d5]'}`}>
                                🚛 Active Fleet
                            </button>
                        </div>

                        <div ref={mapContainerRef} className="flex-1 rounded-xl border border-glassBorder overflow-hidden shadow-2xl" style={{ height: '420px', width: '100%' }}></div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
        {% endraw %}
    </script>
</body>
</html>
